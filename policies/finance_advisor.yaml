# UC-3 finance_advisor — regulated decision-support tool (01 §3).
# Transcribed from the normative example in 04 §3. High stakes: escalation-heavy,
# fail_closed everywhere, non-streaming (ADR-014), always frontier tier (ADR-013).
schema_version: 1
use_case: finance_advisor
policy_version: 4                # bump on every change; engine stamps it into audit (was 3: fast_consistency cut, SL-6)
geography: EU
risk_appetite: low               # low | medium | high (informational + default pack selector)

streaming: false                 # UC-3 is high-stakes decision support (01 §3), so the full
                                 # response is judged before delivery. This was *also* forced
                                 # by ADR-014 while consistency was "on"; that guard no longer
                                 # binds, and the value is deliberately unchanged (M-47).
sampling:
  deep_audit_rate: 0.25
consistency: "off"                 # SL-6: fast_consistency is CUT to roadmap. Was "on".
                                   # 04 §2.3: rag_grounding covers the performance plane
                                   # where context exists. Quoted per Q-09.
cascade_probe: "off"               # ADR-013; high-stakes -> always frontier tier

thresholds:                      # calibrated per 06 §3; conformal-style quantiles
  tau_low: 0.35                  # below -> treat hallucination score as firing
  tau_high: 0.70                 # low..high band -> borderline (ESCALATE-eligible)
  tau_route: 0.55                # cascade escalation threshold (ADR-009)

budget:
  monthly_usd: 200
  per_request_max_tokens: 4000
  loop_max_requests_per_min: 10

actions:                         # label -> action map; unlisted label -> default_action
  pii.*: escalate
  security.prompt_injection: block
  security.blocklist: block
  toxicity.high: block
  toxicity.moderate: escalate
  hallucination.low_confidence: escalate
  hallucination.ungrounded_claim: escalate
  hallucination.unsourced_numeric: escalate
  privacy.person: escalate
  cost.budget_exceeded: block
  cost.loop_detected: block
  conversation.cumulative_risk: escalate
default_action: pass

# ADR-017: action for a confidence-kind signal landing in [tau_low, tau_high).
# `escalate` matches UC-3's escalation-heavy profile (01 §3) and is what makes demo
# beat 4b work: the 05 §4 reference score of 0.41 sits inside the band at the ADR-016
# seed thresholds, so the borderline case is precisely the one a human must see.
borderline_action: escalate

fail_mode:                       # per detector class, when timeout/error (04 §5)
  tier1: fail_closed
  tier2: fail_closed
  performance: fail_closed
  cost: fail_closed

messages:
  block_fallback: "This request can't be completed under {use_case} policy. A specialist has been notified."
  escalate_user_notice: "Your request needs additional verification and has been routed for review."

escalation:
  notify: ["console", "webhook:${REVIEW_WEBHOOK_URL}"]
  quarantine_ttl_s: 3600

blocklist_extra: []
detector_params: {}              # optional per-detector overrides (e.g., toxicity cutoffs)
